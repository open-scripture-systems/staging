           'ご意見は Google フォームに送られるため、通常のウェブの通信と同じく Google が受け取ります。一緒に送られるのは、このページの名前と表示言語だけです（メールアドレスは書いた場合のみ）。このサイトにはアカウントも追跡もありません。いただいた文面は非公開で読み、公開しません。'],

    ok: ['Sent. Thank you.', '送信しました。ありがとうございます。'],
